on:
  schedule:
    # Friday and Saturday, 7:30 AM–8:00 PM Los Angeles time (Aug–Jan)
    - cron: '30,40,50 7 * 1,8-12 5,6'
      timezone: America/Los_Angeles
    - cron: '0,10,20,30,40,50 8-19 * 1,8-12 5,6'
      timezone: America/Los_Angeles
    - cron: '0 20 * 1,8-12 5,6'
      timezone: America/Los_Angeles

    # Sunday–Thursday, hourly (Aug–Jan)
    - cron: '0 * * 1,8-12 0-4'
      timezone: America/Los_Angeles    
  
  workflow_dispatch:

  push:
    paths:
      - 'cfb model output_new.csv'
      - 'CFB Total Output.csv'
    branches:
      - main 
  
jobs:
  update-data:
    runs-on: ubuntu-latest
    env: # API Keys must be before steps, and set as env variables
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr 
            any::tidyr
            any::readr
            any::janitor
            any::glue
            any::lubridate
            any::nflreadr
            any::httr
            any::jsonlite
            any::stringr
            any::remotes
            sportsdataverse/cfbfastR

      - name: Check out repository
        uses: actions/checkout@v3

      - name: Import data
        run: Rscript -e 'source("CFB_Odds/R/cfb_odds.R"); source("CFB_Odds/R/cfb_totals.R")'

      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add *
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m 'Data updated'
            git pull --rebase origin main
            git push origin main
          fi
