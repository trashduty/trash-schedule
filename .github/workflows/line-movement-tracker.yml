name: Daily Line Movement Tracker

on:
  schedule:
    # Run at 9 AM UTC and 9 PM UTC (every 12 hours)
    - cron: '0 9,21 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  line-movement-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Install dependencies
        run: |
          install.packages(c('tidyverse', 'lubridate', 'readr'))
        shell: Rscript {0}

      - name: Run line movement tracker
        run: |
          Rscript CFB_Odds/line_movement_tracker.R
        shell: bash

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CFB_Odds/Reports/ -f
          
          if git diff --quiet --cached; then
            echo "No changes to commit"
          else
            git commit -m "Update line movement reports - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
