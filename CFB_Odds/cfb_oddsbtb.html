<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CFB Model Outputs</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 20px;
      background-color: #f4f7f6;
    }

    .last-updated {
      margin-bottom: 10px;
      font-style: italic;
      color: #666;
      font-size: 0.8rem;
    }

    .weather-link a {
      font-size: 1.1rem;
    }

    .subtabs {
      display: flex;
      gap: 0;
      margin-bottom: 16px;
      border-bottom: 1px solid #ddd;
    }

    .subtab {
      padding: 8px 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      color: #666;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.2s;
    }

    .subtab:hover {
      color: #333;
    }

    .subtab.active {
      color: #2c3e50;
      border-bottom-color: #2c3e50;
    }

    .subtab-content {
      display: none;
    }

    .subtab-content.active {
      display: block;
    }

    .controls {
      margin-bottom: 14px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    button:hover {
      background: #f4f4f4;
    }

    .team-summary {
      font-size: 0.9rem;
      color: #333;
      padding-top: 8px;
    }

    .team-picker {
      width: 360px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.06);
      overflow: hidden;
      margin-top: 10px;
    }

    .team-picker[hidden] {
      display: none;
    }

    .team-picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #eee;
      background: #fafafa;
      gap: 10px;
      flex-wrap: wrap;
    }

    .teamFilter {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 220px;
      font-size: 0.9rem;
      background: #fff;
    }

    .team-picker-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .team-list {
      max-height: 220px;
      overflow: auto;
      padding: 8px 10px;
    }

    .team-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 2px;
      font-size: 0.9rem;
      border-bottom: 1px dashed rgba(0,0,0,0.06);
    }

    .team-item:last-child {
      border-bottom: none;
    }

    .team-count {
      font-size: 0.85rem;
      color: #555;
      padding: 8px 10px 10px 10px;
      border-top: 1px solid #eee;
      background: #fafafa;
    }

    .table-container {
      overflow-x: auto;
      overflow-y: visible;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border-radius: 8px;
      background: white;
    }

    table {
      border-collapse: collapse;
      width: auto;
      font-size: 0.85rem;
    }

    th,
    td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
      white-space: nowrap;
      vertical-align: top;
    }

    td.numeric {
      text-align: right;
    }

    table a {
      color: inherit;
      text-decoration: underline;
    }

    table a:hover {
      opacity: 0.75;
    }

    .team-cell {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
    }

    .team-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .team-logo {
      width: 22px;
      height: 22px;
      object-fit: contain;
      vertical-align: middle;
    }

    .notes-text {
      font-size: 0.72rem;
      line-height: 1.2;
      color: #d32f2f;
      white-space: normal;
      font-style: italic;
    }

    th {
      background-color: #2c3e50;
      color: white;
      position: sticky;
      top: 0;
      z-index: 5;
      cursor: pointer;
      user-select: none;
    }

    th:after {
      content: ' \21D5';
      font-size: 0.7rem;
      opacity: 0.5;
    }

    tr:hover td {
      background-color: rgba(0,0,0,0.04) !important;
    }

    .game-group-header td {
      background: #eef3f8;
      border-top: 2px solid #d8e2ee;
      border-bottom: 1px solid #d8e2ee;
      font-weight: 600;
      color: #243447;
    }

    .game-group-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .game-meta {
      color: #41566e;
      font-weight: 500;
      margin-left: 12px;
      font-size: 0.82rem !important;
      line-height: 1.15;
    }

    .team-subrow td:first-child {
      padding-left: 20px;
    }
  </style>
</head>

<body>
  <h2 style="margin-bottom:6px;">CFB Model Outputs</h2>

  <div class="last-updated" id="status">
    Loading data...
  </div>

  <div class="last-updated weather-link">
    <a
      href="https://www.covers.com/sport/ncaaf/weather"
      target="_blank"
      rel="noopener noreferrer"
    >
      Weather Reports
    </a>
  </div>

  <div class="subtabs" id="subtabs"></div>

  <!-- SPREADS -->
  <div class="subtab-content" id="spreads-content">
    <div class="controls">
      <div>
        <button
          type="button"
          id="spreads-toggleTeamPickerBtn"
          onclick="toggleTeamPicker('spreads')"
        >
          Select teams…
        </button>
      </div>

      <div
        class="team-summary"
        id="spreads-teamSummary"
      >
        All teams
      </div>
    </div>

    <div
      class="team-picker"
      id="spreads-teamPicker"
      hidden
    >
      <div class="team-picker-header">
        <input
          class="teamFilter"
          id="spreads-teamFilter"
          type="text"
          placeholder="Type to find teams..."
          oninput="onTeamFilterInput('spreads')"
        />

        <div class="team-picker-actions">
          <button
            type="button"
            onclick="selectVisibleTeams('spreads')"
          >
            Select visible
          </button>

          <button
            type="button"
            onclick="clearTeamSelection('spreads')"
          >
            Clear
          </button>

          <button
            type="button"
            onclick="toggleTeamPicker('spreads', false)"
          >
            Close
          </button>
        </div>
      </div>

      <div
        class="team-list"
        id="spreads-teamList"
      ></div>

      <div
        class="team-count"
        id="spreads-teamCount"
      >
        Teams: 0 • Selected: 0
      </div>
    </div>

    <div class="table-container">
      <table id="spreads-oddsTable">
        <thead>
          <tr id="spreads-tableHead"></tr>
        </thead>

        <tbody id="spreads-tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- TOTALS -->
  <div class="subtab-content" id="totals-content">
    <div class="controls">
      <div>
        <button
          type="button"
          id="totals-toggleTeamPickerBtn"
          onclick="toggleTeamPicker('totals')"
        >
          Select games…
        </button>
      </div>

      <div
        class="team-summary"
        id="totals-teamSummary"
      >
        All games
      </div>
    </div>

    <div
      class="team-picker"
      id="totals-teamPicker"
      hidden
    >
      <div class="team-picker-header">
        <input
          class="teamFilter"
          id="totals-teamFilter"
          type="text"
          placeholder="Type to find games..."
          oninput="onTeamFilterInput('totals')"
        />

        <div class="team-picker-actions">
          <button
            type="button"
            onclick="selectVisibleTeams('totals')"
          >
            Select visible
          </button>

          <button
            type="button"
            onclick="clearTeamSelection('totals')"
          >
            Clear
          </button>

          <button
            type="button"
            onclick="toggleTeamPicker('totals', false)"
          >
            Close
          </button>
        </div>
      </div>

      <div
        class="team-list"
        id="totals-teamList"
      ></div>

      <div
        class="team-count"
        id="totals-teamCount"
      >
        Games: 0 • Selected: 0
      </div>
    </div>

    <div class="table-container">
      <table id="totals-oddsTable">
        <thead>
          <tr id="totals-tableHead"></tr>
        </thead>

        <tbody id="totals-tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const CSV_URLS = {
      spreads:
        'https://raw.githubusercontent.com/trashduty/trash-schedule/main/CFB_Odds/Data/spreads_odds.csv',

      totals:
        'https://raw.githubusercontent.com/trashduty/trash-schedule/main/CFB_Odds/Data/totals_odds.csv',

      crosswalk:
        'https://raw.githubusercontent.com/trashduty/trash-schedule/main/CFB_Odds/Data/CFB%20Teams%20Full%20Crosswalk.csv',

      model:
        'https://raw.githubusercontent.com/trashduty/trash-schedule/main/cfb%20model%20output_new.csv'
    };

    /*
     * Reload the source CSVs every 60 seconds.
     */
    const REFRESH_INTERVAL = 60000;

    /*
     * Columns retained in the source data but not displayed.
     *
     * commence_time remains available on each row even though it is
     * excluded from the visible table. We use it for kickoff filtering.
     */
    const EXCLUDED_COLUMNS = new Set([
      'logo',
      'last_update_api',
      'commence_time',
      'game_date_et',
      'game_time_et',
      'drive_bin'
    ]);

    const EDGE_THRESHOLD_PERCENT = 3;

    /*
     * Game remains visible until this many minutes after kickoff.
     */
    const DROP_AFTER_START_MINUTES = 10;

    const tabState = {
      spreads: {
        rawData: [],
        allTeams: [],
        selectedTeams: new Set(),
        sortConfig: {
          key: null,
          direction: 'asc'
        },
        columnMapping: []
      },

      totals: {
        rawData: [],
        allGames: [],
        selectedGames: new Set(),
        sortConfig: {
          key: null,
          direction: 'asc'
        },
        columnMapping: []
      }
    };

    let teamLookup = {};
    let notesLookup = {};

    function notifyParentOfHeight() {
      if (window.parent !== window) {
        const height = document.documentElement.scrollHeight;

        window.parent.postMessage(
          {
            type: 'cfb-resize',
            height: height
          },
          '*'
        );
      }
    }

    function parseCsvFromUrl(url) {
      return fetch(url + '?t=' + Date.now())
        .then(response => {
          if (!response.ok) {
            throw new Error(
              'HTTP ' + response.status + ' for ' + url
            );
          }

          return response.text();
        })
        .then(
          csvText =>
            new Promise((resolve, reject) => {
              Papa.parse(csvText, {
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true,

                complete: results => resolve(results),

                error: err => reject(err)
              });
            })
        );
    }

    function buildNotesLookup(modelRows) {
      const lookup = {};

      modelRows.forEach(row => {
        const team = (row['team'] || '')
          .toString()
          .trim();

        const notes = (row['Notes'] || '')
          .toString()
          .trim();

        if (!team) return;

        if (notes) {
          lookup[team] = notes;
        }
      });

      return lookup;
    }

    /*
     * --------------------------------------------------------
     * KICKOFF TIME PARSER
     * --------------------------------------------------------
     *
     * IMPORTANT:
     *
     * Previously game_date_et + game_time_et were passed into:
     *
     * new Date(year, month, day, hour...)
     *
     * which makes JavaScript interpret the kickoff in the
     * viewer's LOCAL timezone.
     *
     * That caused games to remain on the table too long for
     * users outside Eastern Time.
     *
     * We now:
     *
     * 1. Prefer commence_time, which should be an absolute
     *    timestamp from the odds API.
     *
     * 2. If commence_time is unavailable, interpret the
     *    displayed date/time explicitly in America/New_York.
     *
     * This automatically handles EDT and EST.
     * --------------------------------------------------------
     */
    function parseEtDateTimeFromRow(row) {

      /*
       * First choice:
       * exact API timestamp.
       *
       * Example:
       * 2026-08-29T19:00:00Z
       */
      const commenceTime = String(
        row?.commence_time ?? ''
      ).trim();

      if (commenceTime) {
        const parsed = Date.parse(commenceTime);

        if (Number.isFinite(parsed)) {
          return parsed;
        }
      }

      /*
       * Fallback:
       * game_date_et + game_time_et
       */
      const dateStr = String(
        row?.game_date_et ?? ''
      ).trim();

      const timeStr = String(
        row?.game_time_et ?? ''
      ).trim();

      if (!dateStr || !timeStr) {
        return Number.POSITIVE_INFINITY;
      }

      /*
       * Expected date:
       * MM/DD
       */
      const m = dateStr.match(
        /^(\d{1,2})\/(\d{1,2})$/
      );

      /*
       * Expected time:
       * h:mm AM/PM
       */
      const t = timeStr.match(
        /^(\d{1,2}):(\d{2})\s*([AP]M)$/i
      );

      if (!m || !t) {
        return Number.POSITIVE_INFINITY;
      }

      const month = Number(m[1]);
      const day = Number(m[2]);

      let hour = Number(t[1]);

      const minute = Number(t[2]);

      const ampm = t[3].toUpperCase();

      /*
       * Convert 12-hour time to 24-hour time.
       */
      if (hour === 12) {
        hour = 0;
      }

      if (ampm === 'PM') {
        hour += 12;
      }

      const year = new Date().getFullYear();

      /*
       * Create an initial UTC representation using the ET
       * wall-clock components.
       */
      const initialGuess = Date.UTC(
        year,
        month - 1,
        day,
        hour,
        minute,
        0,
        0
      );

      /*
       * Ask the browser what those UTC components correspond
       * to in New York.
       *
       * This lets us determine whether the date is EST or EDT.
       */
      const formatter = new Intl.DateTimeFormat(
        'en-US',
        {
          timeZone: 'America/New_York',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          hourCycle: 'h23'
        }
      );

      const parts = formatter.formatToParts(
        new Date(initialGuess)
      );

      const values = {};

      parts.forEach(part => {
        if (part.type !== 'literal') {
          values[part.type] = Number(part.value);
        }
      });

      const easternAsUTC = Date.UTC(
        values.year,
        values.month - 1,
        values.day,
        values.hour,
        values.minute,
        0,
        0
      );

      /*
       * Determine Eastern Time's UTC offset at kickoff.
       */
      const easternOffset =
        easternAsUTC - initialGuess;

      /*
       * Convert the ET wall-clock kickoff to the actual
       * absolute timestamp.
       */
      return initialGuess - easternOffset;
    }

    /*
     * A game remains on the table until 10 minutes
     * after kickoff.
     */
    function isGameVisible(row) {
      const kickoffTs =
        parseEtDateTimeFromRow(row);

      /*
       * If we can't determine kickoff, leave the game visible
       * rather than accidentally hiding it.
       */
      if (!Number.isFinite(kickoffTs)) {
        return true;
      }

      const cutoffTs =
        kickoffTs +
        (
          DROP_AFTER_START_MINUTES *
          60 *
          1000
        );

      return Date.now() <= cutoffTs;
    }

    function btbTeamToSlug(btbTeam) {
      return (btbTeam || '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function buildTeamLookup(crosswalkRows) {
      const lookup = {};

      crosswalkRows.forEach(row => {
        const fullName = (
          row['btb_team'] || ''
        )
          .toString()
          .trim();

        const logoUrl = (
          row['logo'] || ''
        )
          .toString()
          .trim();

        if (!fullName) return;

        const slug =
          btbTeamToSlug(fullName);

        const injuryUrl = slug
          ? `https://www.covers.com/sport/football/ncaaf/teams/main/${slug}/injuries`
          : null;

        lookup[fullName] = {
          displayName: fullName,
          injuryUrl,
          logoUrl
        };
      });

      return lookup;
    }

    function formatHeader(csvHeader) {
      if (csvHeader === 'game_time_est') {
        return 'Game Time';
      }

      return csvHeader
        .split('_')
        .map(
          word =>
            word.charAt(0).toUpperCase() +
            word.slice(1)
        )
        .join(' ');
    }

    function inferType(csvKey) {
      const k = csvKey.toLowerCase();

      if (k.includes('probability')) {
        return 'probability';
      }

      if (k.includes('edge')) {
        return 'spread_edge';
      }

      if (
        [
          'week',
          'game',
          'team',
          'game_time_est'
        ].includes(k) ||
        k.includes('book')
      ) {
        return 'text';
      }

      return 'decimal';
    }

    function buildColumnMapping(headers) {
      const mapped = headers
        .filter(
          h => !EXCLUDED_COLUMNS.has(h)
        )
        .map(h => ({
          csv: h,
          display: formatHeader(h),
          type: inferType(h)
        }));

      /*
       * Put Edge before Model Prediction.
       */
      const edgeIdx =
        mapped.findIndex(
          c => c.csv === 'edge'
        );

      const modelPredictionIdx =
        mapped.findIndex(
          c =>
            c.csv ===
            'model_prediction'
        );

      if (
        edgeIdx !== -1 &&
        modelPredictionIdx !== -1
      ) {
        const [edgeCol] =
          mapped.splice(edgeIdx, 1);

        const updatedModelIdx =
          mapped.findIndex(
            c =>
              c.csv ===
              'model_prediction'
          );

        mapped.splice(
          updatedModelIdx,
          0,
          edgeCol
        );
      }

      /*
       * Put Model Prediction before Market Line.
       */
      const marketLineIdx =
        mapped.findIndex(
          c => c.csv === 'market_line'
        );

      const updatedModelPredictionIdx =
        mapped.findIndex(
          c =>
            c.csv ===
            'model_prediction'
        );

      if (
        marketLineIdx !== -1 &&
        updatedModelPredictionIdx !== -1 &&
        updatedModelPredictionIdx >
          marketLineIdx
      ) {
        const [modelCol] =
          mapped.splice(
            updatedModelPredictionIdx,
            1
          );

        const updatedMarketIdx =
          mapped.findIndex(
            c =>
              c.csv ===
              'market_line'
          );

        mapped.splice(
          updatedMarketIdx,
          0,
          modelCol
        );
      }

      return mapped;
    }

    function setupSubtabs() {
      const container =
        document.getElementById(
          'subtabs'
        );

      container.innerHTML = '';

      const subtabs = [
        {
          id: 'spreads',
          label: 'Spreads'
        },
        {
          id: 'totals',
          label: 'Totals'
        }
      ];

      subtabs.forEach(subtab => {
        const button =
          document.createElement(
            'button'
          );

        button.className =
          'subtab' +
          (
            subtab.id === 'spreads'
              ? ' active'
              : ''
          );

        button.textContent =
          subtab.label;

        button.addEventListener(
          'click',
          () => switchTab(subtab.id)
        );

        container.appendChild(
          button
        );
      });

      setupContentDivs();
    }

    function setupContentDivs() {
      const spreadsContent =
        document.getElementById(
          'spreads-content'
        );

      const totalsContent =
        document.getElementById(
          'totals-content'
        );

      spreadsContent.classList.add(
        'active'
      );

      totalsContent.classList.remove(
        'active'
      );
    }

    function switchTab(tabId) {
      const contents = [
        'spreads-content',
        'totals-content'
      ];

      const buttons =
        document.querySelectorAll(
          '.subtab'
        );

      contents.forEach(contentId => {
        const content =
          document.getElementById(
            contentId
          );

        if (contentId === tabId + '-content') {
          content.classList.add(
            'active'
          );
        } else {
          content.classList.remove(
            'active'
          );
        }
      });

      buttons.forEach((button, index) => {
        if (
          index === 0 &&
          tabId === 'spreads'
        ) {
          button.classList.add(
            'active'
          );
        } else if (
          index === 1 &&
          tabId === 'totals'
        ) {
          button.classList.add(
            'active'
          );
        } else {
          button.classList.remove(
            'active'
          );
        }
      });
    }

    function toggleTeamPicker(tabId, show) {
      const picker =
        document.getElementById(
          tabId +
          '-teamPicker'
        );

      if (
        show === undefined
      ) {
        show =
          picker.hasAttribute(
            'hidden'
          );
      }

      if (show) {
        picker.removeAttribute(
          'hidden'
        );
      } else {
        picker.setAttribute(
          'hidden',
          ''
        );
      }
    }

    function onTeamFilterInput(tabId) {
      const filterInput =
        document.getElementById(
          tabId + '-teamFilter'
        );

      const filterText =
        filterInput.value
          .toLowerCase();

      const teamList =
        document.getElementById(
          tabId + '-teamList'
        );

      const items =
        teamList.querySelectorAll(
          '.team-item'
        );

      let visibleCount = 0;

      items.forEach(item => {
        const label =
          item.textContent
            .toLowerCase();

        const isVisible =
          label.includes(
            filterText
          );

        if (isVisible) {
          item.style.display =
            'flex';

          visibleCount++;
        } else {
          item.style.display =
            'none';
        }
      });
    }

    function selectVisibleTeams(tabId) {
      const teamList =
        document.getElementById(
          tabId + '-teamList'
        );

      const items =
        teamList.querySelectorAll(
          '.team-item:not([style*="display: none"])'
        );

      const tabData =
        tabState[tabId];

      items.forEach(item => {
        const checkbox =
          item.querySelector(
            'input[type="checkbox"]'
          );

        if (
          checkbox &&
          checkbox.style.display !== 'none'
        ) {
          checkbox.checked =
            true;

          const teamKey =
            checkbox.dataset.team;

          tabData.selectedTeams.add(
            teamKey
          );
        }
      });

      updateTableAndSummary(
        tabId
      );
    }

    function clearTeamSelection(tabId) {
      const teamList =
        document.getElementById(
          tabId + '-teamList'
        );

      const checkboxes =
        teamList.querySelectorAll(
          'input[type="checkbox"]'
        );

      checkboxes.forEach(checkbox => {
        checkbox.checked = false;
      });

      tabState[tabId].selectedTeams.clear();

      updateTableAndSummary(
        tabId
      );
    }

    function updateTableAndSummary(tabId) {
      renderTable(tabId);
      updateTeamSummary(tabId);
    }

    function updateTeamSummary(tabId) {
      const tabData =
        tabState[tabId];

      const summaryDiv =
        document.getElementById(
          tabId + '-teamSummary'
        );

      const selectedCount =
        tabData.selectedTeams.size;

      const allCount =
        tabId === 'spreads'
          ? tabData.allTeams.length
          : tabData.allGames.length;

      if (
        selectedCount === 0 ||
        selectedCount === allCount
      ) {
        summaryDiv.textContent =
          tabId === 'spreads'
            ? 'All teams'
            : 'All games';
      } else {
        summaryDiv.textContent =
          selectedCount +
          ' ' +
          (
            tabId === 'spreads'
              ? 'team'
              : 'game'
          ) +
          (
            selectedCount === 1
              ? ''
              : 's'
          ) +
          ' selected';
      }
    }

    function loadAndRenderTables() {
      Promise.all([
        parseCsvFromUrl(
          CSV_URLS.spreads
        ),

        parseCsvFromUrl(
          CSV_URLS.totals
        ),

        parseCsvFromUrl(
          CSV_URLS.crosswalk
        ),

        parseCsvFromUrl(
          CSV_URLS.model
        )
      ])
        .then(
          ([
            spreadsData,
            totalsData,
            crosswalkData,
            modelData
          ]) => {
            teamLookup =
              buildTeamLookup(
                crosswalkData.data
              );

            notesLookup =
              buildNotesLookup(
                modelData.data
              );

            tabState.spreads.rawData =
              spreadsData.data;

            tabState.spreads.allTeams =
              extractAllTeams(
                spreadsData.data
              );

            tabState.spreads.selectedTeams =
              new Set(
                tabState.spreads.allTeams
              );

            tabState.spreads.columnMapping =
              buildColumnMapping(
                spreadsData.meta
                  .fields
              );

            tabState.totals.rawData =
              totalsData.data;

            tabState.totals.allGames =
              extractAllGames(
                totalsData.data
              );

            tabState.totals.selectedGames =
              new Set(
                tabState.totals.allGames
              );

            tabState.totals.columnMapping =
              buildColumnMapping(
                totalsData.meta
                  .fields
              );

            setupSubtabs();
            renderTeamPicker(
              'spreads'
            );
            renderTeamPicker(
              'totals'
            );
            renderTable(
              'spreads'
            );
            renderTable(
              'totals'
            );

            updateTeamSummary(
              'spreads'
            );
            updateTeamSummary(
              'totals'
            );

            updateStatus();
            notifyParentOfHeight();
          }
        )
        .catch(err => {
          console.error(
            'Error loading data:',
            err
          );

          document.getElementById(
            'status'
          ).textContent =
            'Error loading data: ' +
            err.message;
        });
    }

    function extractAllTeams(rows) {
      const teams = new Set();

      rows.forEach(row => {
        const team = row.team;

        if (team) {
          teams.add(team);
        }
      });

      return Array.from(teams).sort();
    }

    function extractAllGames(rows) {
      const games = new Set();

      rows.forEach(row => {
        const game = row.game;

        if (game) {
          games.add(game);
        }
      });

      return Array.from(games).sort();
    }

    function renderTeamPicker(tabId) {
      const tabData =
        tabState[tabId];

      const teamList =
        document.getElementById(
          tabId + '-teamList'
        );

      teamList.innerHTML = '';

      const teams =
        tabId === 'spreads'
          ? tabData.allTeams
          : tabData.allGames;

      teams.forEach(team => {
        const label =
          document.createElement(
            'label'
          );

        label.className =
          'team-item';

        const checkbox =
          document.createElement(
            'input'
          );

        checkbox.type =
          'checkbox';

        checkbox.dataset.team =
          team;

        checkbox.checked =
          tabData.selectedTeams.has(
            team
          );

        checkbox.addEventListener(
          'change',
          e => {
            if (e.target.checked) {
              tabData.selectedTeams.add(
                team
              );
            } else {
              tabData.selectedTeams.delete(
                team
              );
            }

            updateTableAndSummary(
              tabId
            );
          }
        );

        label.appendChild(
          checkbox
        );

        label.appendChild(
          document.createTextNode(
            team
          )
        );

        teamList.appendChild(
          label
        );
      });

      updateTeamCount(tabId);
    }

    function updateTeamCount(tabId) {
      const tabData =
        tabState[tabId];

      const countDiv =
        document.getElementById(
          tabId + '-teamCount'
        );

      const allCount =
        tabId === 'spreads'
          ? tabData.allTeams.length
          : tabData.allGames.length;

      const selectedCount =
        tabData.selectedTeams.size;

      countDiv.textContent =
        (
          tabId === 'spreads'
            ? 'Teams'
            : 'Games'
        ) +
        ': ' +
        allCount +
        ' • Selected: ' +
        selectedCount;
    }

    function renderTable(tabId) {
      const tabData =
        tabState[tabId];

      const tableBody =
        document.getElementById(
          tabId +
          '-tableBody'
        );

      const tableHead =
        document.getElementById(
          tabId +
          '-tableHead'
        );

      tableBody.innerHTML =
        '';

      tableHead.innerHTML =
        '';

      const columnMapping =
        tabData.columnMapping;

      columnMapping.forEach(col => {
        const th =
          document.createElement(
            'th'
          );

        th.textContent =
          col.display;

        th.dataset.csv =
          col.csv;

        th.addEventListener(
          'click',
          () => sortTable(
            tabId,
            col.csv
          )
        );

        tableHead.appendChild(
          th
        );
      });

      const filterTeams =
        tabData.selectedTeams;

      const groupedRows =
        groupRowsByGame(
          tabData.rawData,
          filterTeams,
          tabId
        );

      let lastGame = null;

      groupedRows.forEach(group => {
        if (group.game !== lastGame) {
          lastGame = group.game;

          const headerRow =
            document.createElement(
              'tr'
            );

          headerRow.className =
            'game-group-header';

          const headerCell =
            document.createElement(
              'td'
            );

          headerCell.colSpan =
            columnMapping.length;

          const titleSpan =
            document.createElement(
              'span'
            );

          titleSpan.className =
            'game-group-title';

          titleSpan.textContent =
            group.game;

          headerCell.appendChild(
            titleSpan
          );

          const metaSpan =
            document.createElement(
              'span'
            );

          metaSpan.className =
            'game-meta';

          metaSpan.textContent =
            (
              group.game_time_est
                ? group
                  .game_time_est +
                  ' ET'
                : ''
            );

          headerCell.appendChild(
            metaSpan
          );

          headerRow.appendChild(
            headerCell
          );

          tableBody.appendChild(
            headerRow
          );
        }

        const row =
          document.createElement(
            'tr'
          );

        row.className =
          'team-subrow';

        columnMapping.forEach(col => {
          const td =
            document.createElement(
              'td'
            );

          if (
            col.type ===
            'numeric'
          ) {
            td.className =
              'numeric';
          }

          const value =
            group[col.csv];

          if (col.csv === 'team') {
            const teamData =
              teamLookup[value];

            if (teamData) {
              const linkDiv =
                document.createElement(
                  'div'
                );

              linkDiv.className =
                'team-cell';

              const link =
                document.createElement(
                  'a'
                );

              link.className =
                'team-link';

              link.href =
                teamData.injuryUrl;

              link.target =
                '_blank';

              if (
                teamData.logoUrl
              ) {
                const img =
                  document.createElement(
                    'img'
                  );

                img.className =
                  'team-logo';

                img.src =
                  teamData.logoUrl;

                img.alt =
                  value;

                link.appendChild(
                  img
                );
              }

              link.appendChild(
                document.createTextNode(
                  value
                )
              );

              linkDiv.appendChild(
                link
              );

              const notes =
                notesLookup[value];

              if (notes) {
                const notesSpan =
                  document.createElement(
                    'span'
                  );

                notesSpan.className =
                  'notes-text';

                notesSpan.textContent =
                  notes;

                linkDiv.appendChild(
                  notesSpan
                );
              }

              td.appendChild(
                linkDiv
              );
            } else {
              td.textContent =
                value;
            }
          } else if (
            col.type ===
            'probability'
          ) {
            const num =
              Number(value);

            if (
              Number.isFinite(num)
            ) {
              td.textContent =
                (num * 100).toFixed(
                  1
                ) +
                '%';

              td.className =
                'numeric';
            } else {
              td.textContent =
                value;
            }
          } else if (
            col.type ===
            'spread_edge'
          ) {
            const num =
              Number(value);

            if (
              Number.isFinite(num)
            ) {
              const displayValue =
                num.toFixed(1);

              td.textContent =
                num > 0
                  ? '+' +
                    displayValue
                  : displayValue;

              td.className =
                'numeric';

              if (
                Math.abs(num) >
                EDGE_THRESHOLD_PERCENT
              ) {
                td.style.fontWeight =
                  'bold';

                td.style.color =
                  num > 0
                    ? '#2e7d32'
                    : '#c62828';
              }
            } else {
              td.textContent =
                value;
            }
          } else if (
            col.type ===
            'decimal'
          ) {
            const num =
              Number(value);

            if (
              Number.isFinite(num)
            ) {
              td.textContent =
                num.toFixed(2);

              td.className =
                'numeric';
            } else {
              td.textContent =
                value;
            }
          } else {
            td.textContent =
              value;
          }

          row.appendChild(td);
        });

        tableBody.appendChild(
          row
        );
      });
    }

    function groupRowsByGame(
      rows,
      selectedTeams,
      tabId
    ) {
      const grouped =
        new Map();

      rows.forEach(row => {
        if (
          !isGameVisible(row)
        ) {
          return;
        }

        const teamKey =
          tabId ===
          'spreads'
            ? row.team
            : row.game;

        if (
          !selectedTeams.has(
            teamKey
          )
        ) {
          return;
        }

        const game =
          row.game;

        if (
          !grouped.has(game)
        ) {
          grouped.set(game, []);
        }

        grouped.get(game).push(row);
      });

      const result = [];

      grouped.forEach(
        (groupRows, game) => {
          result.push({
            game: game,

            game_time_est:
              groupRows[0]
                .game_time_est,

            rows: groupRows
          });

          groupRows.forEach(row => {
            Object.assign(
              result[
                result.length - 1
              ],
              row
            );
          });
        }
      );

      return result;
    }

    function sortTable(tabId, key) {
      const tabData =
        tabState[tabId];

      if (
        tabData.sortConfig.key ===
        key
      ) {
        tabData.sortConfig.direction =
          tabData.sortConfig
            .direction ===
          'asc'
            ? 'desc'
            : 'asc';
      } else {
        tabData.sortConfig.key =
          key;

        tabData.sortConfig.direction =
          'asc';
      }

      renderTable(tabId);
    }

    function updateStatus() {
      const statusDiv =
        document.getElementById(
          'status'
        );

      const now = new Date();

      statusDiv.textContent =
        'Last updated: ' +
        now.toLocaleString();
    }

    window.addEventListener(
      'load',
      () => {
        loadAndRenderTables();

        setInterval(() => {
          loadAndRenderTables();
        }, REFRESH_INTERVAL);
      }
    );
  </script>
</body>
</html>
