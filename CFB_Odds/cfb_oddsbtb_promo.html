<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTB Analytics — CFB Model Preview</title>


  <style>
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 20px;
      background-color: #f4f7f6;
    }

    .last-updated {
      margin-bottom: 10px;
      font-style: italic;
      color: #666;
      font-size: 0.8rem;
    }

    .weather-link a {
      font-size: 1.1rem;
    }

    .subtabs {
      display: flex;
      gap: 0;
      margin-bottom: 16px;
      border-bottom: 1px solid #ddd;
    }

    .subtab {
      padding: 8px 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      color: #666;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.2s;
    }

    .subtab:hover {
      color: #333;
    }

    .subtab.active {
      color: #2c3e50;
      border-bottom-color: #2c3e50;
    }

    .subtab-content {
      display: none;
    }

    .subtab-content.active {
      display: block;
    }

    .controls {
      margin-bottom: 14px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    button:hover {
      background: #f4f4f4;
    }

    .team-summary {
      font-size: 0.9rem;
      color: #333;
      padding-top: 8px;
    }

    .team-picker {
      width: 360px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.06);
      overflow: hidden;
      margin-top: 10px;
    }

    .team-picker[hidden] {
      display: none;
    }

    .team-picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #eee;
      background: #fafafa;
      gap: 10px;
      flex-wrap: wrap;
    }

    .teamFilter {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 220px;
      font-size: 0.9rem;
      background: #fff;
    }

    .team-picker-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .team-list {
      max-height: 220px;
      overflow: auto;
      padding: 8px 10px;
    }

    .team-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 2px;
      font-size: 0.9rem;
      border-bottom: 1px dashed rgba(0,0,0,0.06);
    }

    .team-item:last-child {
      border-bottom: none;
    }

    .team-count {
      font-size: 0.85rem;
      color: #555;
      padding: 8px 10px 10px 10px;
      border-top: 1px solid #eee;
      background: #fafafa;
    }

    .table-container {
      overflow-x: auto;
      overflow-y: visible;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border-radius: 8px;
      background: white;
    }

    table {
      border-collapse: collapse;
      width: auto;
      font-size: 0.85rem;
    }

    th,
    td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
      white-space: nowrap;
      vertical-align: top;
    }

    td.numeric {
      text-align: right;
    }

    table a {
      color: inherit;
      text-decoration: underline;
    }

    table a:hover {
      opacity: 0.75;
    }

    .team-cell {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
    }

    .team-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .team-logo {
      width: 22px;
      height: 22px;
      object-fit: contain;
      vertical-align: middle;
    }

    .notes-text {
      font-size: 0.72rem;
      line-height: 1.2;
      color: #d32f2f;
      white-space: normal;
      font-style: italic;
    }

    th {
      background-color: #2c3e50;
      color: white;
      position: sticky;
      top: 0;
      z-index: 5;
      cursor: pointer;
      user-select: none;
    }

    th:after {
      content: ' \21D5';
      font-size: 0.7rem;
      opacity: 0.5;
    }

    tr:hover td {
      background-color: rgba(0,0,0,0.04) !important;
    }

    .game-group-header td {
      background: #eef3f8;
      border-top: 2px solid #d8e2ee;
      border-bottom: 1px solid #d8e2ee;
      font-weight: 600;
      color: #243447;
    }

    .game-group-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .game-meta {
      color: #41566e;
      font-weight: 500;
      margin-left: 12px;
      font-size: 0.82rem !important;
      line-height: 1.15;
    }

    .team-subrow td:first-child {
      padding-left: 20px;
    }
  </style>
</head>

<body>
  <h2 style="margin-bottom:6px;">BTB Analytics — CFB Model Preview</h2>

  <div class="last-updated" id="status">
    Week 5 historical snapshot · Odds as of October 02, 2026 at 18:56 UTC · Values are fixed.
  </div>


  <div class="subtabs" id="subtabs"></div>

  <!-- SPREADS -->
  <div class="subtab-content" id="spreads-content">
    <div class="controls">
      <div>
        <button
          type="button"
          id="spreads-toggleTeamPickerBtn"
          onclick="toggleTeamPicker('spreads')"
        >
          Select teams…
        </button>
      </div>

      <div
        class="team-summary"
        id="spreads-teamSummary"
      >
        All teams
      </div>
    </div>

    <div
      class="team-picker"
      id="spreads-teamPicker"
      hidden
    >
      <div class="team-picker-header">
        <input
          class="teamFilter"
          id="spreads-teamFilter"
          type="text"
          placeholder="Type to find teams..."
          oninput="onTeamFilterInput('spreads')"
        />

        <div class="team-picker-actions">
          <button
            type="button"
            onclick="selectVisibleTeams('spreads')"
          >
            Select visible
          </button>

          <button
            type="button"
            onclick="clearTeamSelection('spreads')"
          >
            Clear
          </button>

          <button
            type="button"
            onclick="toggleTeamPicker('spreads', false)"
          >
            Close
          </button>
        </div>
      </div>

      <div
        class="team-list"
        id="spreads-teamList"
      ></div>

      <div
        class="team-count"
        id="spreads-teamCount"
      >
        Teams: 0 • Selected: 0
      </div>
    </div>

    <div class="table-container">
      <table id="spreads-oddsTable">
        <thead>
          <tr id="spreads-tableHead"></tr>
        </thead>

        <tbody id="spreads-tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    function parseEtDateTimeFromRow(row) {
      const parsed = Date.parse(row.commence_time || '');
      return Number.isFinite(parsed) ? parsed : Number.POSITIVE_INFINITY;
    }

    const EXCLUDED_COLUMNS = new Set([
      'logo',
      'last_update_api',
      'commence_time',
      'game_date_et',
      'game_time_et',
      'drive_bin'
    ]);

    const EDGE_THRESHOLD_PERCENT = 2.9; // Preserve the reference table color scale.


    const tabState = {
      spreads: {
        rawData: [],
        allTeams: [],
        selectedTeams: new Set(),
        sortConfig: {
          key: null,
          direction: 'asc'
        },
        columnMapping: []
      },

      totals: {
        rawData: [],
        allGames: [],
        selectedGames: new Set(),
        sortConfig: {
          key: null,
          direction: 'asc'
        },
        columnMapping: []
      }
    };

    let teamLookup = {};
    let notesLookup = {};

    function notifyParentOfHeight() {
      if (window.parent !== window) {
        const height = document.documentElement.scrollHeight;

        window.parent.postMessage(
          {
            type: 'cfb-resize',
            height: height
          },
          '*'
        );
      }
    }

    function btbTeamToSlug(btbTeam) {
      return (btbTeam || '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function buildTeamLookup(crosswalkRows) {
      const lookup = {};

      crosswalkRows.forEach(row => {
        const fullName = (
          row['btb_team'] || ''
        )
          .toString()
          .trim();

        const logoUrl = (
          row['logo'] || ''
        )
          .toString()
          .trim();

        if (!fullName) return;

        const slug =
          btbTeamToSlug(fullName);

        const injuryUrl = slug
          ? `https://www.covers.com/sport/football/ncaaf/teams/main/${slug}/injuries`
          : null;

        lookup[fullName] = {
          displayName: fullName,
          injuryUrl,
          logoUrl
        };
      });

      return lookup;
    }

    function formatHeader(csvHeader) {
      if (csvHeader === 'game_time_est') {
        return 'Game Time';
      }

      return csvHeader
        .split('_')
        .map(
          word =>
            word.charAt(0).toUpperCase() +
            word.slice(1)
        )
        .join(' ');
    }

    function inferType(csvKey) {
      const k = csvKey.toLowerCase();

      if (k.includes('probability')) {
        return 'probability';
      }

      if (k.includes('edge')) {
        return 'spread_edge';
      }

      if (
        [
          'week',
          'game',
          'team',
          'game_time_est'
        ].includes(k) ||
        k.includes('book')
      ) {
        return 'text';
      }

      return 'decimal';
    }

    function buildColumnMapping(headers) {
      const mapped = headers
        .filter(
          h => !EXCLUDED_COLUMNS.has(h)
        )
        .map(h => ({
          csv: h,
          display: formatHeader(h),
          type: inferType(h)
        }));

      /*
       * Put Model Prediction before Market Line.
       */
      const marketLineIdx =
        mapped.findIndex(
          c => c.csv === 'market_line'
        );

      const modelPredictionIdx =
        mapped.findIndex(
          c =>
            c.csv ===
            'model_prediction'
        );

      if (
        marketLineIdx !== -1 &&
        modelPredictionIdx !== -1 &&
        modelPredictionIdx >
          marketLineIdx
      ) {
        const [modelCol] =
          mapped.splice(
            modelPredictionIdx,
            1
          );

        const updatedMarketIdx =
          mapped.findIndex(
            c =>
              c.csv ===
              'market_line'
          );

        mapped.splice(
          updatedMarketIdx,
          0,
          modelCol
        );
      }

      /*
       * Put Edge immediately before Model Prediction.
       */
      const edgeIdx =
        mapped.findIndex(
          c => c.csv === 'edge'
        );

      const currentModelIdx =
        mapped.findIndex(
          c =>
            c.csv ===
            'model_prediction'
        );

      if (
        edgeIdx !== -1 &&
        currentModelIdx !== -1
      ) {
        const [edgeCol] =
          mapped.splice(
            edgeIdx,
            1
          );

        const updatedModelIdx =
          mapped.findIndex(
            c =>
              c.csv ===
              'model_prediction'
          );

        mapped.splice(
          updatedModelIdx,
          0,
          edgeCol
        );
      }

      return mapped;
    }

    function setupSubtabs() {
      const container =
        document.getElementById(
          'subtabs'
        );

      container.innerHTML = '';

      const subtabs = [{id: 'spreads', label: 'Spreads'}];

      subtabs.forEach(subtab => {
        const button =
          document.createElement(
            'button'
          );

        button.className =
          'subtab' +
          (
            subtab.id === 'spreads'
              ? ' active'
              : ''
          );

        button.textContent =
          subtab.label;

        button.onclick = ev =>
          switchSubtab(
            subtab.id,
            ev
          );

        container.appendChild(
          button
        );
      });

      document
        .getElementById(
          'spreads-content'
        )
        .classList.add('active');
    }

    function switchSubtab(
      tabId,
      ev
    ) {
      document
        .querySelectorAll(
          '.subtab-content'
        )
        .forEach(el =>
          el.classList.remove(
            'active'
          )
        );

      document
        .getElementById(
          `${tabId}-content`
        )
        .classList.add('active');

      document
        .querySelectorAll('.subtab')
        .forEach(el =>
          el.classList.remove(
            'active'
          )
        );

      if (ev && ev.target) {
        ev.target.classList.add(
          'active'
        );
      }

      setTimeout(
        () =>
          notifyParentOfHeight(),
        100
      );
    }

    function toggleTeamPicker(
      tabId,
      forceOpen
    ) {
      const picker =
        document.getElementById(
          `${tabId}-teamPicker`
        );

      if (!picker) return;

      const isHidden =
        picker.hasAttribute(
          'hidden'
        );

      const open =
        typeof forceOpen ===
        'boolean'
          ? forceOpen
          : isHidden;

      if (open) {
        picker.removeAttribute(
          'hidden'
        );

        setTimeout(
          () =>
            document
              .getElementById(
                `${tabId}-teamFilter`
              )
              ?.focus(),
          0
        );
      } else {
        picker.setAttribute(
          'hidden',
          ''
        );
      }

      setTimeout(
        () =>
          notifyParentOfHeight(),
        100
      );
    }

    function getEdgeGradientColor(
      value,
      thresholdPctPoints
    ) {
      const pct = value * 100;

      const diff =
        pct -
        thresholdPctPoints;

      if (diff >= 0) {
        const lightness =
          Math.max(
            95 - diff * 8,
            30
          );

        return `hsl(120, 70%, ${lightness}%)`;
      }

      const lightness =
        Math.max(
          95 -
            Math.abs(diff) * 8,
          75
        );

      return `hsl(0, 80%, ${lightness}%)`;
    }

    function formatValue(
      value,
      type,
      csvKey
    ) {
      if (
        value === null ||
        value === undefined ||
        value === ''
      ) {
        return '';
      }

      if (
        type === 'probability' ||
        type === 'spread_edge'
      ) {
        return (
          Number(value) * 100
        ).toFixed(2) + '%';
      }

      if (
        csvKey ===
          'model_prediction' ||
        csvKey ===
          'market_line' ||
        csvKey ===
          'best_line'
      ) {
        return Number(value).toFixed(
          1
        );
      }

      if (
        csvKey ===
          'market_price' ||
        csvKey ===
          'best_price'
      ) {
        return Number(value).toFixed(
          0
        );
      }

      if (type === 'text') {
        return String(value);
      }

      if (type === 'decimal') {
        return Number(value).toFixed(
          2
        );
      }

      return value;
    }

    function onTeamFilterInput(
      tabId
    ) {
      renderTeamPicker(tabId);
    }

    function onTeamToggle(
      tabId,
      team,
      isChecked
    ) {
      const state =
        tabState[tabId];

      if (isChecked) {
        state.selectedTeams.add(
          team
        );
      } else {
        state.selectedTeams.delete(
          team
        );
      }

      updateTeamCount(tabId);
      updateTeamSummary(tabId);
      renderTable(tabId);
    }

    function onGameToggle(
      tabId,
      game,
      isChecked
    ) {
      const state =
        tabState[tabId];

      if (isChecked) {
        state.selectedGames.add(
          game
        );
      } else {
        state.selectedGames.delete(
          game
        );
      }

      updateTeamCount(tabId);
      updateTeamSummary(tabId);
      renderTable(tabId);
    }

    function clearTeamSelection(
      tabId
    ) {
      const state =
        tabState[tabId];

      state.selectedTeams.clear();
      state.selectedGames.clear();

      const filterEl =
        document.getElementById(
          `${tabId}-teamFilter`
        );

      if (filterEl) {
        filterEl.value = '';
      }

      renderTeamPicker(tabId);
      updateTeamSummary(tabId);
      renderTable(tabId);
    }

    function selectVisibleTeams(
      tabId
    ) {
      const state =
        tabState[tabId];

      const filterText =
        document
          .getElementById(
            `${tabId}-teamFilter`
          )
          .value.toLowerCase()
          .trim();

      if (tabId === 'totals') {
        state.allGames
          .filter(g =>
            g
              .toLowerCase()
              .includes(filterText)
          )
          .forEach(g =>
            state.selectedGames.add(
              g
            )
          );
      } else {
        state.allTeams
          .filter(t => {
            const displayName = (
              teamLookup[t]
                ?.displayName || t
            ).toLowerCase();

            return (
              displayName.includes(
                filterText
              ) ||
              t
                .toLowerCase()
                .includes(
                  filterText
                )
            );
          })
          .forEach(t =>
            state.selectedTeams.add(
              t
            )
          );
      }

      renderTeamPicker(tabId);
      updateTeamSummary(tabId);
      renderTable(tabId);
    }

    function updateTeamCount(
      tabId
    ) {
      const state =
        tabState[tabId];

      const countEl =
        document.getElementById(
          `${tabId}-teamCount`
        );

      if (!countEl) return;

      if (tabId === 'totals') {
        countEl.textContent =
          `Games: ${state.allGames.length} • Selected: ${state.selectedGames.size}`;
      } else {
        countEl.textContent =
          `Teams: ${state.allTeams.length} • Selected: ${state.selectedTeams.size}`;
      }
    }

    function updateTeamSummary(
      tabId
    ) {
      const state =
        tabState[tabId];

      const el =
        document.getElementById(
          `${tabId}-teamSummary`
        );

      if (!el) return;

      const isSelected =
        tabId === 'totals'
          ? state.selectedGames.size
          : state.selectedTeams.size;

      if (isSelected === 0) {
        el.textContent =
          tabId === 'totals'
            ? 'All games'
            : 'All teams';

        return;
      }

      el.textContent =
        `${isSelected} ${
          tabId === 'totals'
            ? 'game'
            : 'team'
        }${
          isSelected === 1
            ? ''
            : 's'
        } selected`;
    }

    function renderTeamPicker(
      tabId
    ) {
      const state =
        tabState[tabId];

      const container =
        document.getElementById(
          `${tabId}-teamList`
        );

      if (!container) return;

      const filterText =
        document
          .getElementById(
            `${tabId}-teamFilter`
          )
          .value.toLowerCase()
          .trim();

      container.innerHTML = '';

      if (tabId === 'totals') {
        state.allGames
          .filter(g =>
            g
              .toLowerCase()
              .includes(filterText)
          )
          .forEach(game => {
            const id =
              `${tabId}_game_${game.replace(
                /[^a-z0-9]/gi,
                '_'
              )}`;

            const row =
              document.createElement(
                'div'
              );

            row.className =
              'team-item';

            const cb =
              document.createElement(
                'input'
              );

            cb.type = 'checkbox';
            cb.id = id;

            cb.checked =
              state.selectedGames.has(
                game
              );

            cb.onchange = () =>
              onGameToggle(
                tabId,
                game,
                cb.checked
              );

            const label =
              document.createElement(
                'label'
              );

            label.htmlFor = id;
            label.textContent = game;

            row.appendChild(cb);
            row.appendChild(label);

            container.appendChild(
              row
            );
          });
      } else {
        state.allTeams
          .filter(t => {
            const displayName = (
              teamLookup[t]
                ?.displayName || t
            ).toLowerCase();

            return (
              displayName.includes(
                filterText
              ) ||
              t
                .toLowerCase()
                .includes(
                  filterText
                )
            );
          })
          .forEach(team => {
            const displayName =
              teamLookup[team]
                ?.displayName ||
              team;

            const id =
              `${tabId}_team_${team.replace(
                /[^a-z0-9]/gi,
                '_'
              )}`;

            const row =
              document.createElement(
                'div'
              );

            row.className =
              'team-item';

            const cb =
              document.createElement(
                'input'
              );

            cb.type = 'checkbox';
            cb.id = id;

            cb.checked =
              state.selectedTeams.has(
                team
              );

            cb.onchange = () =>
              onTeamToggle(
                tabId,
                team,
                cb.checked
              );

            const label =
              document.createElement(
                'label'
              );

            label.htmlFor = id;
            label.textContent =
              displayName;

            row.appendChild(cb);
            row.appendChild(label);

            container.appendChild(
              row
            );
          });
      }

      updateTeamCount(tabId);
    }

    function onSort(
      tabId,
      key
    ) {
      const state =
        tabState[tabId];

      if (
        state.sortConfig.key === key
      ) {
        state.sortConfig.direction =
          state.sortConfig.direction ===
          'asc'
            ? 'desc'
            : 'asc';
      } else {
        state.sortConfig.key = key;
        state.sortConfig.direction =
          'asc';
      }

      renderTable(tabId);
    }

    function buildTeamCell(
      teamName,
      rowLogo,
      notes
    ) {
      const teamKey = (
        teamName || ''
      )
        .toString()
        .trim();

      const info =
        teamLookup[teamKey] || {};

      const displayName =
        info.displayName ||
        teamKey;

      const url =
        info.injuryUrl || null;

      const logoUrl =
        info.logoUrl ||
        rowLogo ||
        null;

      const wrapper =
        document.createElement(
          'div'
        );

      wrapper.className =
        'team-cell';

      if (url) {
        const a =
          document.createElement(
            'a'
          );

        a.href = url;
        a.target = '_blank';
        a.rel =
          'noopener noreferrer';

        a.className =
          'team-link';

        if (logoUrl) {
          const img =
            document.createElement(
              'img'
            );

          img.src = logoUrl;

          img.alt =
            `${displayName} logo`;

          img.className =
            'team-logo';

          a.appendChild(img);
        }

        const span =
          document.createElement(
            'span'
          );

        span.textContent =
          displayName;

        a.appendChild(span);

        wrapper.appendChild(a);
      } else {
        const line =
          document.createElement(
            'div'
          );

        if (logoUrl) {
          const img =
            document.createElement(
              'img'
            );

          img.src = logoUrl;

          img.alt =
            `${displayName} logo`;

          img.className =
            'team-logo';

          line.appendChild(img);

          line.appendChild(
            document.createTextNode(
              ' '
            )
          );
        }

        line.appendChild(
          document.createTextNode(
            displayName
          )
        );

        wrapper.appendChild(line);
      }

      if (notes) {
        const notesDiv =
          document.createElement(
            'div'
          );

        notesDiv.className =
          'notes-text';

        notesDiv.textContent =
          notes;

        wrapper.appendChild(
          notesDiv
        );
      }

      return wrapper;
    }

    function createGroupsFromRows(
      rows
    ) {
      const map = new Map();

      rows.forEach(
        (row, idx) => {
          const game = (
            row.game || ''
          )
            .toString()
            .trim();

          const week = (
            row.week || ''
          )
            .toString()
            .trim();

          const time = (
            row.game_time_est || ''
          )
            .toString()
            .trim();

          const fallback =
            `${week}|${time}|${idx}`;

          const key =
            game || fallback;

          if (!map.has(key)) {
            map.set(key, {
              key,
              game,
              week,
              game_time_est:
                time,
              game_date_et:
                row.game_date_et ||
                '',
              game_time_et:
                row.game_time_et ||
                '',
              rows: []
            });
          }

          map
            .get(key)
            .rows.push(row);
        }
      );

      return Array.from(
        map.values()
      );
    }

    function getGroupSortValue(
      group,
      key
    ) {
      const vals =
        group.rows
          .map(r => r[key])
          .filter(
            v =>
              v !== null &&
              v !== undefined &&
              v !== ''
          );

      if (!vals.length) {
        return null;
      }

      if (
        vals.every(
          v =>
            typeof v ===
            'number'
        )
      ) {
        return Math.max(...vals);
      }

      return vals[0];
    }

    function sortGroups(
      groups,
      sortConfig
    ) {
      if (
        !sortConfig ||
        !sortConfig.key
      ) {
        return groups.sort(
          (a, b) => {
            const ta =
              parseEtDateTimeFromRow(
                {
                  game_date_et:
                    a.game_date_et ||
                    a.rows?.[0]
                      ?.game_date_et,

                  game_time_et:
                    a.game_time_et ||
                    a.rows?.[0]
                      ?.game_time_et,

                  commence_time:
                    a.rows?.[0]
                      ?.commence_time
                }
              );

            const tb =
              parseEtDateTimeFromRow(
                {
                  game_date_et:
                    b.game_date_et ||
                    b.rows?.[0]
                      ?.game_date_et,

                  game_time_et:
                    b.game_time_et ||
                    b.rows?.[0]
                      ?.game_time_et,

                  commence_time:
                    b.rows?.[0]
                      ?.commence_time
                }
              );

            if (ta !== tb) {
              return ta - tb;
            }

            const wa =
              Number(
                a.week ?? 9999
              );

            const wb =
              Number(
                b.week ?? 9999
              );

            if (wa !== wb) {
              return wa - wb;
            }

            return (
              a.game || ''
            ).localeCompare(
              b.game || ''
            );
          }
        );
      }

      const dir =
        sortConfig.direction ===
        'desc'
          ? -1
          : 1;

      const key =
        sortConfig.key;

      return groups.sort(
        (a, b) => {
          const aVal =
            getGroupSortValue(
              a,
              key
            );

          const bVal =
            getGroupSortValue(
              b,
              key
            );

          if (aVal === bVal) {
            return 0;
          }

          if (aVal === null) {
            return 1;
          }

          if (bVal === null) {
            return -1;
          }

          if (
            typeof aVal ===
              'number' &&
            typeof bVal ===
              'number'
          ) {
            return (
              aVal < bVal
                ? -1
                : 1
            ) * dir;
          }

          return aVal
            .toString()
            .localeCompare(
              bVal.toString()
            ) * dir;
        }
      );
    }

    function sortRowsWithinGroup(
      rows,
      sortConfig
    ) {
      if (
        !sortConfig ||
        !sortConfig.key
      ) {
        return rows
          .slice()
          .sort(
            (a, b) => {
              const aGame = (
                a['game'] || ''
              )
                .toString()
                .trim();

              const bGame = (
                b['game'] || ''
              )
                .toString()
                .trim();

              if (
                aGame === bGame
              ) {
                const aTeam = (
                  a['team'] || ''
                )
                  .toString()
                  .trim();

                const bTeam = (
                  b['team'] || ''
                )
                  .toString()
                  .trim();

                const awayTeam =
                  aGame
                    .split('@')[0]
                    .trim();

                if (
                  aTeam ===
                  awayTeam
                ) {
                  return -1;
                }

                if (
                  bTeam ===
                  awayTeam
                ) {
                  return 1;
                }

                return 0;
              }

              return 0;
            }
          );
      }

      const key =
        sortConfig.key;

      const dir =
        sortConfig.direction ===
        'desc'
          ? -1
          : 1;

      return rows
        .slice()
        .sort(
          (a, b) => {
            const aVal =
              a[key];

            const bVal =
              b[key];

            if (
              aVal === bVal
            ) {
              return 0;
            }

            if (
              aVal === null ||
              aVal === undefined ||
              aVal === ''
            ) {
              return 1;
            }

            if (
              bVal === null ||
              bVal === undefined ||
              bVal === ''
            ) {
              return -1;
            }

            if (
              typeof aVal ===
                'number' &&
              typeof bVal ===
                'number'
            ) {
              return (
                aVal < bVal
                  ? -1
                  : 1
              ) * dir;
            }

            return aVal
              .toString()
              .localeCompare(
                bVal.toString()
              ) * dir;
          }
        );
    }

    function renderTable(tabId) {
      const state =
        tabState[tabId];

      const head =
        document.getElementById(
          `${tabId}-tableHead`
        );

      const body =
        document.getElementById(
          `${tabId}-tableBody`
        );

      if (!head || !body) {
        return;
      }

      head.innerHTML = '';
      body.innerHTML = '';

      if (
        !state.rawData ||
        state.rawData.length === 0
      ) {
        return;
      }

      const activeCols =
        state.columnMapping.filter(
          col =>
            Object.prototype
              .hasOwnProperty.call(
                state.rawData[0],
                col.csv
              )
        );

      activeCols.forEach(col => {
        const th =
          document.createElement(
            'th'
          );

        th.textContent =
          col.display;

        th.onclick = () =>
          onSort(
            tabId,
            col.csv
          );

        head.appendChild(th);
      });

      let processedData =
        state.rawData;

      /*
       * Apply team/game selector.
       */
      if (tabId === 'totals') {
        if (
          state.selectedGames
            .size > 0
        ) {
          processedData =
            state.rawData.filter(
              row =>
                state.selectedGames.has(
                  (
                    row['game'] ||
                    ''
                  )
                    .toString()
                    .trim()
                )
            );
        }
      } else {
        if (
          state.selectedTeams
            .size > 0
        ) {
          processedData =
            state.rawData.filter(
              row =>
                state.selectedTeams.has(
                  (
                    row['team'] ||
                    ''
                  )
                    .toString()
                    .trim()
                )
            );
        }
      }

      /*
       * ------------------------------------------------
       * TOTALS TABLE
       * ------------------------------------------------
       */
      if (tabId !== 'spreads') {

        if (!state.sortConfig.key) {
          processedData =
            processedData
              .slice()
              .sort(
                (a, b) => {
                  const ta =
                    parseEtDateTimeFromRow(
                      a
                    );

                  const tb =
                    parseEtDateTimeFromRow(
                      b
                    );

                  if (ta !== tb) {
                    return ta - tb;
                  }

                  return (
                    a.game || ''
                  )
                    .toString()
                    .localeCompare(
                      (
                        b.game ||
                        ''
                      ).toString()
                    );
                }
              );
        }

        if (
          state.sortConfig.key
        ) {
          processedData =
            processedData
              .slice()
              .sort(
                (a, b) => {
                  const key =
                    state
                      .sortConfig
                      .key;

                  const valA =
                    a[key];

                  const valB =
                    b[key];

                  if (
                    valA ===
                    valB
                  ) {
                    return 0;
                  }

                  if (
                    valA ===
                      null ||
                    valA ===
                      undefined
                  ) {
                    return 1;
                  }

                  if (
                    valB ===
                      null ||
                    valB ===
                      undefined
                  ) {
                    return -1;
                  }

                  let comparison;

                  if (
                    typeof valA ===
                      'number' &&
                    typeof valB ===
                      'number'
                  ) {
                    comparison =
                      valA < valB
                        ? -1
                        : 1;
                  } else {
                    comparison =
                      valA
                        .toString()
                        .localeCompare(
                          valB.toString()
                        );
                  }

                  return state
                    .sortConfig
                    .direction ===
                    'asc'
                    ? comparison
                    : -comparison;
                }
              );
        }

        processedData.forEach(
          row => {
            const tr =
              document.createElement(
                'tr'
              );

            activeCols.forEach(
              col => {
                const td =
                  document.createElement(
                    'td'
                  );

                const val =
                  row[col.csv];

                td.textContent =
                  formatValue(
                    val,
                    col.type,
                    col.csv
                  );

                if (
                  col.type !==
                  'text'
                ) {
                  td.classList.add(
                    'numeric'
                  );
                }

                if (
                  typeof val ===
                    'number' &&
                  col.type ===
                    'spread_edge'
                ) {
                  td.style.backgroundColor =
                    getEdgeGradientColor(
                      val,
                      EDGE_THRESHOLD_PERCENT
                    );
                }

                tr.appendChild(td);
              }
            );

            body.appendChild(tr);
          }
        );

        setTimeout(
          () =>
            notifyParentOfHeight(),
          100
        );

        return;
      }

      /*
       * ------------------------------------------------
       * SPREADS TABLE
       * ------------------------------------------------
       */
      let groups =
        createGroupsFromRows(
          processedData
        );

      groups =
        sortGroups(
          groups,
          state.sortConfig
        );

      groups.forEach(group => {
        const gameHeaderTr =
          document.createElement(
            'tr'
          );

        gameHeaderTr.className =
          'game-group-header';

        const gameTd =
          document.createElement(
            'td'
          );

        gameTd.colSpan =
          activeCols.length;

        const title =
          document.createElement(
            'span'
          );

        title.className =
          'game-group-title';

        title.textContent =
          group.game ||
          'Matchup';

        const meta =
          document.createElement(
            'span'
          );

        meta.className =
          'game-meta';

        const datePart = (
          group.game_date_et ||
          ''
        )
          .toString()
          .trim();

        const timePart = (
          group.game_time_et ||
          ''
        )
          .toString()
          .trim();

        meta.textContent = [
          datePart,

          timePart
            ? `${timePart} ET`
            : ''
        ]
          .filter(Boolean)
          .join(' • ');

        gameTd.appendChild(
          title
        );

        if (meta.textContent) {
          gameTd.appendChild(
            meta
          );
        }

        gameHeaderTr.appendChild(
          gameTd
        );

        body.appendChild(
          gameHeaderTr
        );

        const sortedRows =
          sortRowsWithinGroup(
            group.rows,
            state.sortConfig
          );

        sortedRows.forEach(
          (row, rowIdx) => {
            const tr =
              document.createElement(
                'tr'
              );

            tr.className =
              'team-subrow';

            activeCols.forEach(
              col => {
                const td =
                  document.createElement(
                    'td'
                  );

                const val =
                  row[col.csv];

                const hideGame =
                  col.csv ===
                  'game';

                const hideGameTime =
                  col.csv ===
                    'game_time_est' ||
                  col.csv ===
                    'commence_time';

                const hideWeekOnSecondRow =
                  col.csv ===
                    'week' &&
                  rowIdx > 0;

                if (
                  col.csv ===
                  'team'
                ) {
                  const teamKey = (
                    row.team || ''
                  )
                    .toString()
                    .trim();

                  const notes =
                    notesLookup[
                      teamKey
                    ];

                  td.appendChild(
                    buildTeamCell(
                      row.team,
                      row.logo,
                      notes
                    )
                  );
                } else if (
                  hideGame ||
                  hideGameTime ||
                  hideWeekOnSecondRow
                ) {
                  td.textContent =
                    '';
                } else {
                  td.textContent =
                    formatValue(
                      val,
                      col.type,
                      col.csv
                    );
                }

                if (
                  col.type !==
                  'text'
                ) {
                  td.classList.add(
                    'numeric'
                  );
                }

                if (
                  !(
                    hideGame ||
                    hideGameTime ||
                    hideWeekOnSecondRow
                  ) &&
                  typeof val ===
                    'number' &&
                  col.type ===
                    'spread_edge'
                ) {
                  td.style.backgroundColor =
                    getEdgeGradientColor(
                      val,
                      EDGE_THRESHOLD_PERCENT
                    );
                }

                tr.appendChild(td);
              }
            );

            body.appendChild(tr);
          }
        );
      });

      setTimeout(
        () =>
          notifyParentOfHeight(),
        100
      );
    }

    /*
     * Populate the selectable team list using only
     * games still present after kickoff filtering.
     */
    function hydrateTeams() {
      const state =
        tabState.spreads;

      const set =
        new Set();

      state.rawData.forEach(
        row => {
          const t = (
            row['team'] || ''
          )
            .toString()
            .trim();

          if (t) {
            set.add(t);
          }
        }
      );

      state.allTeams =
        Array.from(set).sort(
          (a, b) => {
            const nameA = (
              teamLookup[a]
                ?.displayName || a
            ).toLowerCase();

            const nameB = (
              teamLookup[b]
                ?.displayName || b
            ).toLowerCase();

            return nameA.localeCompare(
              nameB
            );
          }
        );

      const existing =
        new Set(
          state.allTeams
        );

      state.selectedTeams.forEach(
        t => {
          if (
            !existing.has(t)
          ) {
            state.selectedTeams.delete(
              t
            );
          }
        }
      );
    }

    /*
     * Populate totals-game picker using only visible games.
     */
    function hydrateGames() {
      const state =
        tabState.totals;

      const set =
        new Set();

      state.rawData.forEach(
        row => {
          const g = (
            row['game'] || ''
          )
            .toString()
            .trim();

          if (g) {
            set.add(g);
          }
        }
      );

      state.allGames =
        Array.from(set).sort(
          (a, b) =>
            a.localeCompare(b)
        );

      const existing =
        new Set(
          state.allGames
        );

      state.selectedGames.forEach(
        g => {
          if (
            !existing.has(g)
          ) {
            state.selectedGames.delete(
              g
            );
          }
        }
      );
    }

    function initialize() {
      setupSubtabs();
      tabState.spreads.rawData = SNAPSHOT.rows;
      tabState.spreads.columnMapping = buildColumnMapping(SNAPSHOT.fields);
      teamLookup = buildTeamLookup(SNAPSHOT.rows.map(row => ({btb_team: row.team, logo: row.logo})));
      hydrateTeams();
      renderTeamPicker('spreads');
      renderTable('spreads');
      window.addEventListener('message', event => {
        if (event.data?.type === 'request-cfb-height') notifyParentOfHeight();
      });
      window.addEventListener('resize', notifyParentOfHeight);
      document.querySelectorAll('.team-logo').forEach(img => {
        img.addEventListener('load', notifyParentOfHeight);
        img.addEventListener('error', () => { img.style.display = 'none'; notifyParentOfHeight(); });
      });
      setTimeout(notifyParentOfHeight, 250);
    }
    document.addEventListener('DOMContentLoaded', initialize);
  </script>
